<button class="open-btn" [class.active]="sidebarOpen" (click)="toggleSidebar()">
  <img src="/assets/icon/sidebar-btn.svg" alt="Navegação" />
</button>

<aside class="sidebar-logged h-100" [class.active]="sidebarOpen">
  <div class="sidebar-inner">
    <button class="sidebar-close-btn" (click)="toggleSidebar()">
      <img src="/assets/icon/sidebar-btn.svg" alt="Fechar" />
    </button>

    <nav class="sidebar-nav">
      <ul class="sidebar-nav-list">

        <!-- Dashboard -->
        <li>
          <button
            class="nav-link-btn"
            [class.active]="isActive('/dashboard')"
            (click)="navigateTo('/dashboard')"
          >
            <img src="/assets/icon/home.svg" alt="" />
            {{ "SIDEBAR.DASHBOARD" | translate }}
          </button>
        </li>

        <li class="nav-separator"></li>

        <!-- ThinkSus ESG -->
        <li>
          <button
            class="nav-link-btn nav-group-btn"
            [class.open]="openMenus['esg']"
            (click)="toggleMenu('esg')"
          >
            <img src="/assets/icon/assesment.svg" alt="" />
            <span>{{ "SIDEBAR.ESG" | translate }}</span>
            <span class="nav-arrow" [class.rotated]="openMenus['esg']">›</span>
          </button>
          <ul class="submenu" [class.open]="openMenus['esg']">
            <li>
              <button
                class="nav-link-btn nav-link-sub"
                [class.active]="isActive('/document-verification')"
                (click)="navigateTo('/document-verification')"
              >
                <img src="/assets/icon/assesment.svg" alt="" />
                {{ "SIDEBAR.DOCUMENTS" | translate }}
              </button>
            </li>
            <li>
              <button
                class="nav-link-btn nav-link-sub"
                [class.active]="isActive('/forms')"
                (click)="navigateTo('/forms')"
              >
                <img src="/assets/icon/control_forms.svg" alt="" />
                {{ "SIDEBAR.FORMULARIOS" | translate }}
              </button>
            </li>
            <li>
              <button
                class="nav-link-btn nav-link-sub"
                [class.active]="isActive('/ai-examples')"
                (click)="navigateTo('/ai-examples')"
              >
                <img src="/assets/icon/init.svg" alt="" />
                {{ "SIDEBAR.SUGGESTIONS_IA" | translate }}
              </button>
            </li>
          </ul>
        </li>

        <li class="nav-separator"></li>

        <!-- Governança -->
        <li>
          <button
            class="nav-link-btn nav-group-btn"
            [class.open]="openMenus['governance']"
            (click)="toggleMenu('governance')"
          >
            <img src="/assets/icon/governance.svg" alt="" />
            <span>{{ "SIDEBAR.GOVERNANCE" | translate }}</span>
            <span class="nav-arrow" [class.rotated]="openMenus['governance']">›</span>
          </button>
          <ul class="submenu" [class.open]="openMenus['governance']">
            <li>
              <button
                class="nav-link-btn nav-link-sub"
                [class.active]="isActive('/governance/support')"
                (click)="navigateTo('/governance/support')"
              >
                <img src="/assets/icon/subject.svg" alt="" />
                {{ "SIDEBAR.GOV_SUPPORT" | translate }}
              </button>
            </li>
            <li>
              <button
                class="nav-link-btn nav-link-sub"
                [class.active]="isActive('/governance/roadmap')"
                (click)="navigateTo('/governance/roadmap')"
              >
                <img src="/assets/icon/results.svg" alt="" />
                {{ "SIDEBAR.GOV_ROADMAP" | translate }}
              </button>
            </li>
            <li>
              <button
                class="nav-link-btn nav-link-sub"
                [class.active]="isActive('/governance/docs')"
                (click)="navigateTo('/governance/docs')"
              >
                <img src="/assets/icon/use-instructions.svg" alt="" />
                {{ "SIDEBAR.GOV_DOCS" | translate }}
              </button>
            </li>
          </ul>
        </li>

      </ul>
    </nav>
  </div>

  <div class="sidebar-bottom">
    <button
      class="nav-link-btn"
      [class.active]="isActive('/password')"
      (click)="navigateTo('/password')"
    >
      <img src="/assets/icon/use-instructions.svg" alt="" />
      {{ "SIDEBAR.PASSWORD" | translate }}
    </button>
    <a class="nav-link-btn" (click)="logout()">
      <img src="/assets/icon/logout.svg" alt="" />
      {{ "SIDEBAR.LOGOUT" | translate }}
    </a>
  </div>
</aside>

<div class="card-score">
  <div class="card-score-info">
    <div class="form-header">
      <h2>Gestão de Exemplos Few-Shot</h2>
      <p>Cadastre e gerencie exemplos usados para treinar a IA de sugestões</p>
    </div>

    <button
      mat-raised-button
      color="primary"
      class="btn-novo-usuario"
      (click)="openCreateModal()"
    >
      Novo exemplo
    </button>
  </div>

  <div class="filters d-flex gap-3 mb-3">
    <div class="filter-item">
      <label class="form-label">Pilar</label>
      <select class="form-select" [(ngModel)]="filterPilar" (ngModelChange)="onFilterChange()">
        <option [ngValue]="null">Todos</option>
        <option *ngFor="let pilar of pilares" [value]="pilar">{{ pilar }}</option>
      </select>
    </div>

    <div class="filter-item">
      <label class="form-label">Setor</label>
      <select class="form-select" [(ngModel)]="filterSetor" (ngModelChange)="onFilterChange()">
        <option [ngValue]="null">Todos</option>
        <option *ngFor="let setor of setores" [value]="setor">{{ setor }}</option>
      </select>
    </div>
  </div>

  <div class="tabela-container">
    <table mat-table [dataSource]="dataSource" class="full-width-table">
      <ng-container matColumnDef="pilar">
        <th mat-header-cell *matHeaderCellDef>Pilar</th>
        <td mat-cell *matCellDef="let example">{{ example.pilar }}</td>
      </ng-container>

      <ng-container matColumnDef="setor">
        <th mat-header-cell *matHeaderCellDef>Setor</th>
        <td mat-cell *matCellDef="let example">{{ example.setor || "Genérico" }}</td>
      </ng-container>

      <ng-container matColumnDef="score">
        <th mat-header-cell *matHeaderCellDef>Score</th>
        <td mat-cell *matCellDef="let example">{{ example.score }}</td>
      </ng-container>

      <ng-container matColumnDef="inputContext">
        <th mat-header-cell *matHeaderCellDef>Contexto</th>
        <td mat-cell *matCellDef="let example">{{ example.inputContext }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let example">
          <button mat-icon-button (click)="openEditModal(example._id)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="removeExample(example._id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          Nenhum exemplo cadastrado.
        </td>
      </tr>
    </table>

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
